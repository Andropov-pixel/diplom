name: Deploy to the prod-server
on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: [ self-hosted, prod ]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch updates
        run: |
          cd /www/backoffice
          git fetch
          git switch main
          git merge origin/main
          docker compose up --build --force-recreate -dwsl --update